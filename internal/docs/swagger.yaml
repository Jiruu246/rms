info:
  contact:
    name: RMS
  description: Restaurant Management System HTTP API.
  title: RMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns an access token; sets a refresh
        token cookie
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Jiruu246_rms_internal_dto.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-github_com_Jiruu246_rms_internal_dto_AccessToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the refresh token and clears the refresh token cookie
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      description: Exchanges the refresh token cookie for a new access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-github_com_Jiruu246_rms_internal_dto_AccessToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RegisterUserSchema'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-github_com_Jiruu246_rms_internal_dto_User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      summary: Register a new user
      tags:
      - auth
  /categories:
    get:
      description: 'Cursor-paginated list of categories. Sort format: "field:asc,field2:desc"
        (supported fields: display_order, create_time).'
      parameters:
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - description: Opaque pagination cursor
        in: query
        name: cursor
        type: string
      - description: Sort spec, e.g. display_order:asc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-github_com_Jiruu246_rms_pkg_pagination_PageResponse-github_com_Jiruu246_rms_internal_dto_Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Jiruu246_rms_internal_dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-github_com_Jiruu246_rms_internal_dto_Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - categories
  /categories/{id}:
    delete:
      parameters:
      - description: Category ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Jiruu246_rms_pkg_utils.APIResponse-any'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - categories
    get:
